name: RADIO WORLD APK Fordítás

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Forráskód letöltése
        uses: actions/checkout@v4

      - name: Java 17 beállítása
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle beállítása és APK fordítás
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Debug APK lefordítása
        run: gradle assembleDebug

      - name: Kész APK feltöltése letöltéshez
        uses: actions/upload-artifact@v4
        with:
          name: RadioWorld-Redmi12-v3.1
          path: app/build/outputs/apk/debug/app-debug.apk
