name: RADIO WORLD APK Fordítás

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Forraskod letoltese
        uses: actions/checkout@v4

      - name: Manifest es Layout javitasa
        run: |
          echo "" | base64 -d > app/src/main/AndroidManifest.xml
          sed -i 's|<LinearLayout|<LinearLayout xmlns:android="http://android.com"|g' app/src/main/res/layout/activity_main.xml

      - name: Java 17 beallitasa
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle beallitasa es APK forditas
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Debug APK leforditasa
        run: gradle assembleDebug

      - name: Kesz APK feltoltese letolteshez
        uses: actions/upload-artifact@v4
        with:
          name: RadioWorld-Redmi12-v3.1
          path: app/build/outputs/apk/debug/app-debug.apk
