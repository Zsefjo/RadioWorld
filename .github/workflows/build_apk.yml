name: RADIO WORLD APK Fordítás

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Forráskód letöltése
        uses: actions/checkout@v4

      - name: Tiszta XML fájlok generálása
        run: |
          python3 -c '
          ns = "http" + "://://android.com"
          manifest = f"""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="{ns}">
              <uses-feature android:name="android.hardware.usb.host" android:required="false" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <queries>
                  <package android:name="com.miui.fm" />
                  <package android:name="com.mediatek.fmradio" />
              </queries>
              <application
                  android:allowBackup="true"
                  android:label="RADIO WORLD"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.DarkActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" />
                      </intent-filter>
                      <meta-data
                          android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"
                          android:resource="@xml/device_filter" />
                  </activity>
              </application>
          </manifest>
          """
          open("app/src/main/AndroidManifest.xml", "w").write(manifest)
          with open("app/src/main/res/layout/activity_main.xml", "r") as f:
              layout = f.read()
          if "://android.com" not in layout:
              layout = layout.replace("<LinearLayout", f"<LinearLayout xmlns:android=\"{ns}\"", 1)
              open("app/src/main/res/layout/activity_main.xml", "w").write(layout)
          '

      - name: Java 17 beállítása
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle beállítása és APK fordítás
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Debug APK lefordítása
        run: gradle assembleDebug

      - name: Kész APK feltöltése letöltéshez
        uses: actions/upload-artifact@v4
        with:
          name: RadioWorld-Redmi12-v3.1
          path: app/build/outputs/apk/debug/app-debug.apk
